name: Python CI

on:
  push:
    branches:
      - main

jobs:
  python-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: python --version

      - name: List Repository Files
        run: ls -la

      - name: Run hello.py
        run: python hello.py